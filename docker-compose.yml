services:
  backend:
    build:
      context: "https://github.com/buttiepedro/tablero_especialidades_gacitua.git#main:backend"
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/especialidades.db}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - SECRET_KEY=${SECRET_KEY:-dev-secret}
      - DB_SCHEMA=${DB_SCHEMA:-}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: "https://github.com/buttiepedro/tablero_especialidades_gacitua.git#main:frontend"
    restart: unless-stopped
    environment:
      - API_URL=${API_URL:-http://localhost:5000}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
