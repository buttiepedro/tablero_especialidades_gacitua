services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      - API_URL=${API_URL:-http://localhost:5000}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

