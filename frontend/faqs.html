<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAQs - Tablero general</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260826a" />
</head>
<body>
  <main>
    <header class="page-header">
      <div>
        <p class="hero-label">GACITUA BOT</p>
        <h1>Preguntas frecuentes</h1>
      </div>
      <button id="logout" class="secondary">Cerrar sesión</button>
    </header>
    <nav class="page-nav">
      <a href="general.html">General</a>
      <a href="especialidades.html">Especialidades</a>
      <a href="profesionales.html">Profesionales</a>
      <a href="practicas.html">Prácticas</a>
      <a href="faqs.html" class="active">FAQs</a>
      <a href="textos.html">Textos predefinidos</a>
    </nav>
    <section class="card">
      <div class="toolbar">
        <p class="hint">Gestioná las preguntas frecuentes que responde el bot.</p>
        <button type="button" id="new-faq-btn">+ Nueva FAQ</button>
      </div>
      <div class="table-controls">
        <div class="table-search">
          <span class="table-search-icon" aria-hidden="true"></span>
          <input type="search" id="faq-search" placeholder="Buscar por pregunta o respuesta" aria-label="Buscar preguntas frecuentes" />
        </div>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
          <tr>
            <th data-sort="question">Pregunta</th>
            <th data-sort="answer">Respuesta</th>
            <th></th>
          </tr>
          </thead>
          <tbody id="faq-table-body"></tbody>
        </table>
      </div>
      <p id="faq-status" class="hint"></p>
    </section>
  </main>

  <div class="dialog-overlay hidden" id="faq-dialog">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="faq-dialog-title">
      <h2 id="faq-dialog-title">Nueva FAQ</h2>
      <form id="faq-form">
        <label>
          Pregunta
          <input type="text" id="faq-question" required />
        </label>
        <label>
          Respuesta
          <textarea id="faq-answer" rows="4" required></textarea>
        </label>
        <div class="dialog-actions">
          <button type="button" class="secondary" id="faq-dialog-cancel">Cancelar</button>
          <button type="submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="shared.js?v=20260826a"></script>
  <script src="faqs.js?v=20260825c"></script>
</body>
</html>
