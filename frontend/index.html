<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Tablero general</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Tablero general</h1>
    <section class="card login-card">
      <p class="hero-label">GACITUA BOT</p>
      <h2>Inicio de sesión</h2>
      <form id="login-form">
        <label>
          Usuario
          <input type="text" id="username" autocomplete="username" required />
        </label>
        <label>
          Contraseña
          <div class="input-with-icon">
            <input type="password" id="password" autocomplete="current-password" required />
            <button type="button" id="toggle-password" class="icon-button" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></svg>
              <svg class="icon-eye-off hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" /><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" /><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" /><path d="m2 2 20 20" /></svg>
            </button>
          </div>
        </label>
        <button type="submit">Entrar</button>
      </form>
      <p id="login-error" class="hint"></p>
      <p class="hint">
        Una vez logueado serás redirigido a la pantalla general, donde podés completar la descripción
        y los datos de la clínica.
      </p>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="shared.js"></script>
  <script src="login.js"></script>
</body>
</html>
