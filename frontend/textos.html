<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Textos predefinidos - Tablero general</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header class="page-header">
      <div>
        <p class="hero-label">GACITUA BOT</p>
        <h1>Textos predefinidos</h1>
      </div>
      <button id="logout" class="secondary">Cerrar sesión</button>
    </header>
    <nav class="page-nav">
      <a href="general.html">General</a>
      <a href="especialidades.html">Especialidades</a>
      <a href="faqs.html">FAQs</a>
      <a href="textos.html" class="active">Textos predefinidos</a>
    </nav>
    <section class="card">
      <div class="toolbar">
        <p class="hint">Textos predefinidos que el bot puede reutilizar en sus respuestas.</p>
        <button type="button" id="new-texto-btn">+ Nuevo texto</button>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
          <tr>
            <th>Nombre</th>
            <th>Texto</th>
            <th></th>
          </tr>
          </thead>
          <tbody id="texto-table-body"></tbody>
        </table>
      </div>
      <p id="texto-status" class="hint"></p>
    </section>
  </main>

  <div class="dialog-overlay hidden" id="texto-dialog">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="texto-dialog-title">
      <h2 id="texto-dialog-title">Nuevo texto</h2>
      <form id="texto-form">
        <label>
          Nombre
          <input type="text" id="texto-nombre" required />
        </label>
        <label>
          Texto
          <textarea id="texto-cuerpo" rows="4" required></textarea>
        </label>
        <div class="dialog-actions">
          <button type="button" class="secondary" id="texto-dialog-cancel">Cancelar</button>
          <button type="submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="shared.js"></script>
  <script src="textos.js"></script>
</body>
</html>
