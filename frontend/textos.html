<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Textos predefinidos - Tablero general</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header class="page-header">
      <div>
        <p class="hero-label">GACITUA BOT</p>
        <h1>Textos predefinidos</h1>
      </div>
      <button id="logout" class="secondary">Cerrar sesión</button>
    </header>
    <nav class="page-nav">
      <a href="general.html">General</a>
      <a href="especialidades.html">Especialidades</a>
      <a href="faqs.html">FAQs</a>
      <a href="textos.html" class="active">Textos predefinidos</a>
    </nav>
    <section class="card">
      <form id="texto-form" class="form-grid">
        <label>
          Nombre
          <input type="text" id="texto-nombre" required />
        </label>
        <label>
          Texto
          <textarea id="texto-cuerpo" rows="3" required></textarea>
        </label>
        <button type="submit">Guardar texto</button>
      </form>
      <p id="texto-status" class="hint"></p>
      <div class="faq-list" id="texto-list"></div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="shared.js"></script>
  <script src="textos.js"></script>
</body>
</html>
