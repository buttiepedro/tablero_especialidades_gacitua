<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profesionales - Tablero general</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260818" />
</head>
<body>
  <main class="professionals-page">
    <header class="page-header">
      <div>
        <p class="hero-label">GACITUA BOT</p>
        <h1>Profesionales</h1>
      </div>
      <button id="logout" class="secondary">Cerrar sesión</button>
    </header>
    <nav class="page-nav">
      <a href="general.html">General</a>
      <a href="especialidades.html">Especialidades</a>
      <a href="profesionales.html" class="active">Profesionales</a>
      <a href="faqs.html">FAQs</a>
      <a href="textos.html">Textos predefinidos</a>
    </nav>
    <section class="card">
      <div class="toolbar">
        <p class="hint">
          Se sincronizan automáticamente con `POST /sync/profesionales`, o los cargás a mano acá.
        </p>
        <button type="button" id="new-profesional-btn">+ Nuevo profesional</button>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
          <tr>
            <th>Nombre completo</th>
            <th>Especialidades</th>
            <th>Nota web efectiva</th>
            <th>Criterio manual</th>
            <th></th>
          </tr>
          </thead>
          <tbody id="profesionales-table-body"></tbody>
        </table>
      </div>
      <p id="profesionales-status" class="hint"></p>
    </section>
  </main>

  <div class="dialog-overlay hidden" id="profesional-dialog">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="profesional-dialog-title">
      <h2 id="profesional-dialog-title">Nuevo profesional</h2>
      <form id="profesional-form">
        <label>
          Nombre completo
          <input type="text" id="profesional-nombre-completo" required />
        </label>
        <label>
          Especialidad principal
          <input type="text" id="profesional-especialidad" />
        </label>
        <label>
          Segunda especialidad
          <input type="text" id="profesional-especialidad2" />
        </label>
        <label>
          Tercera especialidad
          <input type="text" id="profesional-especialidad3" />
        </label>
        <label>
          ID profesional
          <input type="number" id="profesional-id" min="1" />
        </label>
        <label>
          Nota web original
          <textarea id="profesional-notaweb" rows="3"></textarea>
        </label>
        <div class="dialog-actions">
          <button type="button" class="secondary" id="profesional-dialog-cancel">Cancelar</button>
          <button type="submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="shared.js?v=20260818"></script>
  <script src="profesionales.js?v=20260818"></script>
</body>
</html>
